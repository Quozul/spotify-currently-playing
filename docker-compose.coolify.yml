services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: postgres

    volumes:
      - spotify_currently_playing_postgres:/var/lib/postgresql/data

  app:
    build: .

    depends_on:
      - db

volumes:
  spotify_currently_playing_postgres: {}
